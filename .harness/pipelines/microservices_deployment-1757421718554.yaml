pipeline:
  name: Build microservices_deployment
  identifier: Build_microservices_deployment_1757421767204
  projectIdentifier: MicroserviceECOMM
  orgIdentifier: default
  stages:
    - stage:
        name: Build
        identifier: Build
        type: CI
        spec:
          cloneCodebase: true
          execution:
            steps:
              - step:
                  type: Run
                  name: Gradle_Build_with_tests
                  identifier: Gradle_Build_with_tests
                  spec:
                    connectorRef: Dockerhub
                    image: gradle:8.14.3-jdk17
                    shell: Sh
                    command: |-
                      gradle -v
                      which gradle
                      cd cart-cna-microservice/
                      gradle clean
                      gradle test
                      gradle build
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - cart-cna-microservice/build/test-results/**/*.xml
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Docker
            spec: {}
  properties:
    ci:
      codebase:
        connectorRef: account.Github
        repoName: microservices_deployment
        build: <+input>
